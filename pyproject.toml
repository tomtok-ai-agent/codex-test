[project]
name = "date-poet"
version = "0.1.0"
description = "Console app that generates poem about current date via OpenAI"
authors = [
    {name = "Codex User"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "click>=8.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
date-poet = "date_poet.cli:main"
